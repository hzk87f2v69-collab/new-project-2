<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ace Fitness | Workout Tracker</title>
    <link rel="stylesheet" href="/public/assets/css/styles.css" />
    <link rel="stylesheet" href="/public/assets/css/workout-tracker.css" />
  </head>
  <body class="wt-page">

        <header class="site-header">
      <div class="nav">
        <!-- Left: Logo -->
        <a class="brand" href="/" aria-label="Ace Fitness Home">
          <span class="brand-mark">AF</span>
        </a>

        <!-- Center: Desktop Links -->
        <div class="nav-desktop-links">
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link" href="/programs">Programs</a>
          <a class="nav-link" href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/workout-tracker">Tracker</a>
          <a class="nav-link" href="/ai">AI Coach</a>
          <a class="nav-link" href="/contact">Contact</a>
        </div>

        <!-- Right: Icons & Mobile Toggle -->
        <div class="nav-icons">
          <!-- Search Icon -->
          <a class="nav-icon" href="#" aria-label="Search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </a>
          <!-- Profile Icon -->
          <a class="nav-icon" href="/profile.html" aria-label="Profile">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </a>
          <!-- Hamburger -->
          <button class="nav-dumbbell" id="navDumbbell" type="button" aria-label="Open menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
        </div>

        <!-- Mobile Mega Dropdown (Full Screen) -->
        <nav class="nav-mega-menu" id="navMegaMenu">
          <a href="/">Home</a>
          <a href="/programs">Programs</a>
          <a href="/my-courses">My Courses</a>
          <a href="/dashboard">Dashboard</a>
          <a href="/workout-tracker">Workout Tracker</a>
          <a href="/ai">AI Coach</a>
          <div class="nav-mega-divider"></div>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </header>

    <!-- ══════════ APP SHELL ══════════ -->
    <div id="wtApp" class="wt-app">

      <!-- ── VIEW 1: DASHBOARD ── -->
      <section id="viewDashboard" class="wt-view is-active">
        <div class="wt-dash-header">
          <h1 class="wt-dash-title">Workout Tracker</h1>
          <button class="wt-settings-btn" id="settingsBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>

        <div class="wt-quick-actions">
          <button class="wt-action-btn" id="newWorkoutBtn">
            <span class="wt-action-btn-icon">⚡</span>New Workout
          </button>
          <button class="wt-action-btn" id="newPlanBtn">
            <span class="wt-action-btn-icon">📋</span>New Custom Plan
          </button>
        </div>

        <button class="wt-my-ex-btn" id="myExercisesBtn">
          <span>💪 My Exercises</span>
          <span class="wt-ex-badge" id="totalExCount">0</span>
        </button>

        <div id="dayListContainer" class="wt-day-list"></div>
      </section>

      <!-- ── VIEW 2: DAY DETAIL ── -->
      <section id="viewDay" class="wt-view">
        <div class="wt-sub-header">
          <div class="wt-sub-title-wrap">
            <h2 class="wt-sub-title" id="dayViewTitle">MONDAY</h2>
            <p class="wt-sub-muscles" id="dayViewMuscles"></p>
          </div>
          <button class="wt-settings-btn" id="editDayBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>

        <div class="wt-day-action-row">
          <button class="wt-outline-btn" id="addExBtn">+ Exercises</button>
          <button class="wt-outline-btn" id="notesBtn">📝 Notes</button>
        </div>

        <div id="dayExerciseList" class="wt-ex-list"></div>
      </section>

      <!-- ── VIEW 3: EXERCISE DETAIL ── -->
      <section id="viewExercise" class="wt-view">
        <div class="wt-sub-header">
          <h2 class="wt-ex-detail-title" id="exDetailTitle">Exercise</h2>
          <button class="wt-settings-btn" id="exOptionsBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>

        <div class="wt-tabs">
          <button class="wt-tab is-active" data-tab="sets">Sets</button>
          <button class="wt-tab" data-tab="analyze">Analyze</button>
          <button class="wt-tab" data-tab="1rm">1RM</button>
        </div>

        <div id="tabSets"    class="wt-tab-pane is-active"><div id="setHistoryContainer"></div></div>
        <div id="tabAnalyze" class="wt-tab-pane"><div id="analyzeContainer"></div></div>
        <div id="tab1rm"     class="wt-tab-pane"><div id="oneRmContainer"></div></div>

        <button class="wt-fab" id="addSetFab">+</button>
      </section>

      <!-- bottom nav removed -->

    </div><!-- /wtApp -->

    <!-- ══════════ MODALS ══════════ -->

    <!-- Add/Log Set Modal -->
    <div class="wt-modal-backdrop hide" id="addSetModal">
      <div class="wt-modal-sheet">
        <div class="wt-modal-handle"></div>
        <div class="wt-modal-header">
          <h3 class="wt-modal-title" id="addSetModalTitle">Log Set</h3>
          <button class="wt-modal-close" id="closeSetModal">✕</button>
        </div>
        <div class="wt-modal-body">
          <div class="wt-field-row">
            <div class="wt-modal-field">
              <label for="setReps">Reps</label>
              <input id="setReps" type="number" min="1" placeholder="10" inputmode="numeric" />
            </div>
            <div class="wt-modal-field">
              <label for="setWeight">Weight (kg)</label>
              <input id="setWeight" type="number" min="0" step="0.5" placeholder="60" inputmode="decimal" />
            </div>
          </div>
          <div class="wt-modal-field">
            <label for="setNotes">Notes (optional)</label>
            <input id="setNotes" type="text" placeholder="e.g. Felt easy" />
          </div>
          <button class="wt-modal-submit" id="saveSetBtn">Save Set</button>
        </div>
      </div>
    </div>

    <!-- Add Exercise to Day Modal -->
    <div class="wt-modal-backdrop hide" id="addExModal">
      <div class="wt-modal-sheet">
        <div class="wt-modal-handle"></div>
        <div class="wt-modal-header">
          <h3 class="wt-modal-title">Add Exercise</h3>
          <button class="wt-modal-close" id="closeExModal">✕</button>
        </div>
        <div class="wt-modal-body">
          <input class="wt-ex-picker-search" id="exPickerSearch" type="text" placeholder="Search exercises…" autocomplete="off" />
          <div id="exPickerList" class="wt-ex-picker-list"></div>
          <div class="wt-ex-new-form">
            <h4>Create new exercise</h4>
            <div class="wt-modal-field">
              <label for="newExName">Name</label>
              <input id="newExName" type="text" placeholder="e.g. Incline Bench Press" />
            </div>
            <div class="wt-modal-field">
              <label for="newExMuscle">Muscle Group</label>
              <input id="newExMuscle" type="text" placeholder="e.g. Chest" />
            </div>
            <button class="wt-modal-submit" id="createExBtn">Create &amp; Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- My Exercises Library Modal -->
    <div class="wt-modal-backdrop hide" id="myExModal">
      <div class="wt-modal-sheet">
        <div class="wt-modal-handle"></div>
        <div class="wt-modal-header">
          <h3 class="wt-modal-title">My Exercises</h3>
          <button class="wt-modal-close" id="closeMyExModal">✕</button>
        </div>
        <div class="wt-modal-body">
          <input class="wt-ex-picker-search" id="myExSearch" type="text" placeholder="Search…" />
          <div id="myExList" class="wt-ex-picker-list"></div>
        </div>
      </div>
    </div>

    <script src="/public/assets/js/app.js"></script>
    <script src="/public/assets/js/workout-tracker.js"></script>
  </body>
</html>
