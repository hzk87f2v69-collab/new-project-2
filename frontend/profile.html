    <main class="dashboard-shell" style="padding-top: 2rem; padding-bottom: 2rem;">
      <div class="container">
        <div>
            <h3>Your Personal Profile</h3>
            <form id="profileForm" class="form-grid">
              <div class="field">
                <label for="profileName">Full Name</label>
                <input id="profileName" name="name" type="text" required />
              </div>
              <div class="field">
                <label for="profileEmail">Email Address</label>
                <input id="profileEmail" name="email" type="email" disabled />
              </div>
              <div class="field">
                <label for="profilePhoneNumber">Phone / WhatsApp Number</label>
                <input id="profilePhoneNumber" name="phoneNumber" type="text" placeholder="Your contact number" />
              </div>
              <div class="field">
                <label for="profileFitnessGoal">Fitness Goal + Basic Focus</label>
                <select id="profileFitnessGoal" name="fitnessGoal">
                  <option value="">Select your main goal</option>
                  <option value="Fat Loss">Fat Loss</option>
                  <option value="Muscle Gain">Muscle Gain</option>
                  <option value="Strength">Strength</option>
                  <option value="Home Workout">Home Workout</option>
                  <option value="General Fitness">General Fitness</option>
                </select>
              </div>
              <div class="field">
                <label for="profileAge">Age</label>
                <input id="profileAge" name="age" type="number" min="1" max="120" placeholder="Age" />
              </div>
              <div class="field">
                <label for="profileHeightCm">Height (cm)</label>
                <input id="profileHeightCm" name="heightCm" type="number" min="30" max="300" placeholder="Height in cm" />
              </div>
              <div class="field">
                <label for="profileWeightKg">Weight (kg)</label>
                <input id="profileWeightKg" name="weightKg" type="number" min="20" max="500" placeholder="Weight in kg" />
              </div>
              <div class="field field-full">
                <label for="profileHealthNotes">Health / Injury Information</label>
                <textarea
                  id="profileHealthNotes"
                  name="healthNotes"
                  placeholder="Mention any injuries, limitations, or important medical notes for safer training."
                ></textarea>
              </div>
              <!-- ── Diet & AI fields ── -->
              <div class="field">
                <label for="profileActivity">Activity Level</label>
                <select id="profileActivity" name="activityLevel">
                  <option value="">Select activity level</option>
                  <option value="Sedentary">Sedentary (desk job, little exercise)</option>
                  <option value="Lightly Active">Lightly Active (1–2 days/week)</option>
                  <option value="Moderate">Moderate (3–5 days/week)</option>
                  <option value="Very Active">Very Active (6–7 days/week)</option>
                  <option value="Athlete">Athlete (2x/day training)</option>
                </select>
              </div>
              <div class="field">
                <label for="profileDietType">Diet Preference</label>
                <select id="profileDietType" name="dietType">
                  <option value="">Select diet type</option>
                  <option value="No restriction">No restriction</option>
                  <option value="Non-Vegetarian">Non-Vegetarian</option>
                  <option value="Vegetarian">Vegetarian</option>
                  <option value="Vegan">Vegan</option>
                  <option value="Eggetarian">Eggetarian</option>
                  <option value="Jain">Jain</option>
                </select>
              </div>
              <div class="field field-full">
                <label for="profileAllergies">Allergies / Foods to Avoid</label>
                <input id="profileAllergies" name="allergies" type="text" placeholder="e.g. dairy, gluten, peanuts (leave blank if none)" />
              </div>
              <div class="field field-full">
                <label for="profileJoinedAt">Member Since</label>
                <input id="profileJoinedAt" name="joinedAt" type="text" disabled />
              </div>
              <div class="stack-actions">
                <button class="btn" type="submit">Save Profile</button>
                <a class="btn-outline" href="/dashboard">Back to Dashboard</a>
              </div>
              <p id="profileStatus" class="status-text"></p>
            </form>

        </div>
      </div>
    </main>

    <script src="/public/assets/js/app.js"></script>
    <script src="/public/assets/js/profile.js"></script>
