<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ace Fitness Login | Secure Access</title>
    <link rel="stylesheet" href="../public/assets/css/styles.css" />
    <link rel="icon" type="image/jpeg" href="../public/assets/images/favicon.jpg">
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#20c7ff">
</head>
  <body class="auth-page">
    <header class="site-header">
      <div class="nav">
        <div class="brand" aria-label="Ace Fitness">
          <img src="../public/assets/images/logo.png" alt="AF" class="brand-mark">
        </div>
        <span class="auth-header-pill">Members only</span>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-section">
        <div class="container auth-grid">
          <div class="section-header auth-copy">
            <span class="eyebrow">Secure Access</span>
            <h1>Login once. Train everywhere.</h1>
            <p>
              Your programs, tracker, AI coach, profile, and progress stay unlocked on this browser until you log out.
            </p>
          </div>
          <div class="auth-card liquid-glass-card">
            <div class="auth-tabs">
              <button class="auth-tab active" id="loginTab" type="button" data-auth-tab="login">Login</button>
              <button class="auth-tab" id="registerTab" type="button" data-auth-tab="register">Register</button>
            </div>
            <form class="auth-form active" id="loginForm" method="post" data-auth-form="login" novalidate>
              <div class="field">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" required />
              </div>
              <button class="btn" type="submit">Login</button>
            </form>
            <form class="auth-form" id="registerForm" method="post" data-auth-form="register" novalidate>
              <div class="field">
                <label for="registerName">Name</label>
                <input id="registerName" name="name" type="text" required />
              </div>
              <div class="field">
                <label for="registerEmail">Email</label>
                <input id="registerEmail" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="registerPassword">Password</label>
                <input id="registerPassword" name="password" type="password" minlength="6" required />
              </div>
              <button class="btn" type="submit">Create Account</button>
            </form>
            <p id="authStatus" class="status-text"></p>
          </div>
        </div>
      </section>
    </main>

    <script src="../public/assets/js/app.js"></script>
    <script src="../public/assets/js/auth.js?v=5"></script>
  </body>
</html>
