<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ace Fitness Login | Secure Access</title>
    <link rel="stylesheet" href="/public/assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/">
          <span class="brand-mark">AF</span>
          <span>Ace Fitness</span>
        </a>
        <button class="nav-dumbbell" id="navDumbbell" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="10" width="4" height="4" rx="1"/><rect x="18" y="10" width="4" height="4" rx="1"/>
            <line x1="6" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="18" y2="12"/>
            <rect x="10" y="8" width="4" height="8" rx="1"/>
          </svg>
        </button>
        <nav class="nav-mega-menu" id="navMegaMenu">
          <a href="/profile.html"><span class="menu-icon">&#128100;</span>Profile</a>
          <a href="/"><span class="menu-icon">&#127968;</span>Home</a>
          <a href="/programs"><span class="menu-icon">&#127919;</span>Programs</a>
          <a href="/my-courses"><span class="menu-icon">&#127891;</span>My Courses</a>
          <a href="/dashboard"><span class="menu-icon">&#128202;</span>Dashboard</a>
          <a href="/workout-tracker"><span class="menu-icon">&#127947;</span>Workout Tracker</a>
          <a href="/ai"><span class="menu-icon">🤖</span>AI Coach</a>
          <div class="nav-mega-divider"></div>
          <a href="/contact"><span class="menu-icon">&#128233;</span>Contact</a>
        </nav>
      </div>
    </header>

    <main class="auth-shell">
      <section class="section">
        <div class="container auth-grid">
          <div class="section-header">
            <span class="eyebrow">Member Access</span>
            <h1>Secure your account and unlock structured progress.</h1>
            <p>
              Register once, use the instant dummy checkout, and access your purchased programs from a premium dashboard
              built for consistency.
            </p>
          </div>
          <div class="auth-card">
            <div class="auth-tabs">
              <button class="auth-tab active" id="loginTab" type="button">Login</button>
              <button class="auth-tab" id="registerTab" type="button">Register</button>
            </div>
            <form class="auth-form active" id="loginForm">
              <div class="field">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" required />
              </div>
              <button class="btn" type="submit">Login</button>
            </form>
            <form class="auth-form" id="registerForm">
              <div class="field">
                <label for="registerName">Name</label>
                <input id="registerName" name="name" type="text" required />
              </div>
              <div class="field">
                <label for="registerEmail">Email</label>
                <input id="registerEmail" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="registerPassword">Password</label>
                <input id="registerPassword" name="password" type="password" minlength="6" required />
              </div>
              <button class="btn" type="submit">Create Account</button>
            </form>
            <p id="authStatus" class="status-text"></p>
          </div>
        </div>
      </section>
    </main>

    <script src="/public/assets/js/app.js"></script>
    <script src="/public/assets/js/auth.js"></script>
  </body>
</html>
